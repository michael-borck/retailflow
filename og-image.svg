<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/><stop offset="0.55" stop-color="#2563eb"/><stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="-0.1" r="0.7">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.85"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- logo mark: white shopping bag in a soft tile -->
  <rect x="84" y="120" width="104" height="104" rx="24" fill="#ffffff" opacity="0.14"/>
  <path d="M120 168 a16 16 0 0 1 32 0" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
  <path d="M103 168 h66 l-4.6 53 a9 9 0 0 1 -9 8.2 H116.6 a9 9 0 0 1 -9 -8.2 Z" fill="#ffffff"/>

  <text x="212" y="200" font-size="78" font-weight="800" fill="#ffffff" letter-spacing="-1.5">RetailFlow</text>
  <text x="86" y="320" font-size="40" fill="#ffffff" opacity="0.95" font-weight="600">Fashion · Homewares · Lifestyle</text>
  <text x="86" y="372" font-size="26" fill="#ffffff" opacity="0.8">Australia's multi-channel retailer · 50 stores · founded 2008</text>

  <line x1="86" y1="470" x2="320" y2="470" stroke="#ffffff" stroke-width="3" opacity="0.45"/>
  <text x="86" y="524" font-size="23" fill="#ffffff" opacity="0.82">A fictional company: a Curtin University executive-education teaching scenario.</text>
