<body>
  <header class="doc-header">
    <a href="../../internal.html" class="back">← Internal Portal</a>

      <h1>Document title</h1>

      <p>Body content. Use h2/h3, tables, ul/ol, and callouts (note / warn / risk).</p>
      <div class="callout note"><strong>Note:</strong> example callout.</div>

  </main>

  <footer class="doc-footer">RetailFlow Pty Ltd · Internal use only · Not for distribution</footer>
